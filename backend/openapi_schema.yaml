components:
  schemas:
    AlertEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rule:
          type: string
          format: uuid
          readOnly: true
        metric_type:
          type: string
          readOnly: true
        portfolio_name:
          type: string
          readOnly: true
        threshold_value:
          type: string
          readOnly: true
        triggered_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
        message:
          type: string
          readOnly: true
        is_acknowledged:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_acknowledged
      - message
      - metric_type
      - portfolio_name
      - rule
      - threshold_value
      - triggered_value
    AlertRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        portfolio:
          type: string
          format: uuid
        portfolio_name:
          type: string
          readOnly: true
        metric_type:
          $ref: '#/components/schemas/MetricTypeEnum'
        comparator:
          $ref: '#/components/schemas/ComparatorEnum'
        threshold_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - metric_type
      - portfolio
      - portfolio_name
      - threshold_value
    AlertRuleRequest:
      type: object
      properties:
        portfolio:
          type: string
          format: uuid
        metric_type:
          $ref: '#/components/schemas/MetricTypeEnum'
        comparator:
          $ref: '#/components/schemas/ComparatorEnum'
        threshold_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        is_active:
          type: boolean
      required:
      - metric_type
      - portfolio
      - threshold_value
    AssetClassEnum:
      enum:
      - EQUITY
      - ETF
      - OPTION
      - CRYPTO
      - CASH
      type: string
      description: |-
        * `EQUITY` - Equity
        * `ETF` - Exchange Traded Fund
        * `OPTION` - Options Contract
        * `CRYPTO` - Cryptocurrency
        * `CASH` - Cash Equivalent
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
