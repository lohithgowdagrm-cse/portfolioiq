openapi: 3.0.3
info:
  title: PortfolioIQ API
  version: 1.0.0
  description: Real-Time Portfolio & Risk Analytics Engine REST API
paths:
  /api/v1/alerts/events/:
    get:
      operationId: v1_alerts_events_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertEventList'
          description: ''
  /api/v1/alerts/events/{id}/ack/:
    post:
      operationId: v1_alerts_events_ack_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/alerts/rules/:
    get:
      operationId: v1_alerts_rules_list
