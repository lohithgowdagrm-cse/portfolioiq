version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolioiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolioiq_db
      POSTGRES_USER: portfolioiq
      POSTGRES_PASSWORD: portfolioiq_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolioiq -d portfolioiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portfolioiq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: portfolioiq_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: production
      DEBUG: "False"
      SECRET_KEY: dev-docker-insecure-key-change-in-prod
      DATABASE_URL: postgres://portfolioiq:portfolioiq_secret@postgres:5432/portfolioiq_db
      USE_SQLITE: "False"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      MARKET_DATA_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: portfolioiq_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DJANGO_ENV: production
      DATABASE_URL: postgres://portfolioiq:portfolioiq_secret@postgres:5432/portfolioiq_db
      USE_SQLITE: "False"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: portfolioiq_scheduler
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      DJANGO_ENV: production
      DATABASE_URL: postgres://portfolioiq:portfolioiq_secret@postgres:5432/portfolioiq_db
      USE_SQLITE: "False"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: portfolioiq_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
